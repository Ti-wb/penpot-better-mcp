name: penpot-better-mcp-test

# Disposable, loopback-only fixture. Never point these credentials at a real site.
x-env: &env
  PENPOT_PUBLIC_URI: http://127.0.0.1:19001
  PENPOT_FLAGS: disable-email-verification disable-secure-session-cookies enable-registration enable-login-with-password enable-access-tokens disable-telemetry enable-mcp enable-prepl-server
  PENPOT_SECRET_KEY: penpot-better-mcp-local-disposable-fixture-only-not-for-production

services:
  penpot-frontend:
    image: penpotapp/frontend@sha256:80f0baff19a275c5aee54956e9c44cce80cb7c0488bb8f27d92df7fe4f100a78
    ports: ["127.0.0.1:19001:8080"]
    environment: *env
    volumes: ["assets:/opt/data/assets"]
    depends_on: [penpot-backend, penpot-exporter, penpot-mcp]
  penpot-backend:
    image: penpotapp/backend@sha256:121472d0ab4a9bdf450884159bde28805027022a230d14c8f3907c316623aea8
    environment:
      <<: *env
      PENPOT_DATABASE_URI: postgresql://postgres/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: penpot-test
      PENPOT_REDIS_URI: redis://valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
    volumes: ["assets:/opt/data/assets"]
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_started}
  penpot-exporter:
    image: penpotapp/exporter@sha256:85f1d6eff14b49a131b4245dc3000aa738ac48ca103f1d3aa12228d7473544c0
    environment:
      <<: *env
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
  penpot-mcp:
    image: penpotapp/mcp@sha256:08292a1e3b6e0993a6eae8f6b6f5cdce6aa69023327511400b3dc8dd0f69c8fa
  penpot-mcp-timeout:
    profiles: [faults]
    image: penpotapp/mcp@sha256:08292a1e3b6e0993a6eae8f6b6f5cdce6aa69023327511400b3dc8dd0f69c8fa
    ports: ["127.0.0.1:14411:4401", "127.0.0.1:14412:4402"]
    environment:
      PENPOT_MCP_SERVER_HOST: 0.0.0.0
      PENPOT_MCP_TOOL_TIMEOUT_S: "2"
      PENPOT_MCP_REPL_ENABLE: "false"
      PENPOT_MCP_LOG_LEVEL: error
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: penpot-test
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 2s
      timeout: 3s
      retries: 30
  valkey:
    image: valkey/valkey:8.1
volumes:
  postgres:
  assets:
